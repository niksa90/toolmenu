name: toolmenu
description: Lint your MCP server's tool menu for changes that confuse agents or break caches.
author: niksa90
branding:
  icon: list
  color: yellow

inputs:
  command:
    description: How to start the server over stdio, e.g. "node dist/server.js". Use this or url.
    required: false
  url:
    description: A Streamable HTTP endpoint to check instead of a stdio command.
    required: false
  headers:
    description: >-
      HTTP headers for a url server, one "Name: value" per line. Pass keys in from
      the workflow's secrets (see docs/github-action.md), not as plain text.
    required: false
  env:
    description: >-
      Environment variables for a stdio server, one KEY=value per line (it only gets a
      minimal environment otherwise).
    required: false
  baseline:
    description: The committed menu file to diff against.
    required: false
    default: menu.json
  scenario:
    description: Optional scenario.yml for a session run (tools not marked readOnlyHint are refused unless it allows writes).
    required: false
  baseline-from:
    description: >-
      Which menu to diff against the baseline: "snapshot" (default), or "session":
      every tool the scenario saw, for servers whose tools appear after an unlock.
      Needs a scenario.
    required: false
    default: snapshot
  fail-on:
    description: Fail the job on findings at or above this level (error, warn or info).
    required: false
    default: error
  comment:
    description: Post (and update) one PR comment with the report.
    required: false
    default: 'true'
  release:
    description: >-
      Release versions for the version-bump check, "<old>..<new>" (e.g. "1.4.0..1.5.0").
      "auto" (default): on a PR, the version in package.json, pyproject.toml or Cargo.toml
      on the base branch and head; on a tag push, the previous version tag and this one.
      "off" skips the check.
    required: false
    default: auto
  version:
    description: >-
      toolmenu version from npm. Default: the version of this Action (the tag you
      pinned), so the CLI and the Action match. Set "latest" to always run the newest.
    required: false
  cli:
    description: Override how toolmenu is run (for testing a local build), e.g. "node dist/cli.js".
    required: false
  token:
    description: Token for the PR comment. Needs pull-requests write.
    required: false
    default: ${{ github.token }}

outputs:
  report:
    description: Path to the markdown report.
    value: ${{ steps.run.outputs.report }}
  exit-code:
    description: 0 clean, 1 findings at or above fail-on, 2 couldn't run.
    value: ${{ steps.run.outputs.exit-code }}
  skipped:
    description: >-
      'true' when the check was skipped because the PR runs without the repository's
      secrets. The job still passes then: gate on this output if a skip shouldn't.
    value: ${{ steps.run.outputs.skipped }}

runs:
  using: composite
  steps:
    - id: run
      shell: bash
      run: '"$GITHUB_ACTION_PATH/action/run.sh"'
      env:
        TOOLMENU_COMMAND: ${{ inputs.command }}
        TOOLMENU_URL: ${{ inputs.url }}
        TOOLMENU_HEADERS: ${{ inputs.headers }}
        TOOLMENU_ENV: ${{ inputs.env }}
        TOOLMENU_BASELINE: ${{ inputs.baseline }}
        TOOLMENU_SCENARIO: ${{ inputs.scenario }}
        TOOLMENU_BASELINE_FROM: ${{ inputs.baseline-from }}
        TOOLMENU_FAIL_ON: ${{ inputs.fail-on }}
        TOOLMENU_COMMENT: ${{ inputs.comment }}
        TOOLMENU_VERSION: ${{ inputs.version }}
        TOOLMENU_RELEASE: ${{ inputs.release }}
        TOOLMENU_BASE_REF: ${{ github.base_ref }}
        TOOLMENU_CLI: ${{ inputs.cli }}
        TOOLMENU_PR: ${{ github.event.pull_request.number }}
        # Runs without the repository's secrets: pull request events (pull_request
        # and its review events; pull_request_target does get secrets) from a fork,
        # where a deleted fork has no head repo at all, and anything Dependabot
        # triggers, which only gets Dependabot secrets.
        TOOLMENU_NO_SECRETS: ${{ (github.event.pull_request.number > 0 && github.event_name != 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository) || github.actor == 'dependabot[bot]' }}
        GH_TOKEN: ${{ inputs.token }}
