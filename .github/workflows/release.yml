name: release

# Push a tag like v0.4.0 to publish that version to npm, with provenance, and to
# create its GitHub Release, then to list it in the MCP Registry (server.json). No
# secrets: npm trusts this workflow (trusted publishing: niksa90/toolmenu,
# release.yml, environment npm) and the registry signs in with the same GitHub OIDC
# token. The npm environment (Settings → Environments) limits publishing to v* tags.
#
# Three jobs. build installs without scripts and compiles, so only the TypeScript
# compiler (and scripts/rule-docs.mjs) touches the files that are published; test runs
# the tests, and with them the dependencies' code, apart from those files; publish
# runs nothing but npm publish on the tarball build packed, once both passed. No job
# with dependency code has the OIDC token or the npm token, and no job uses a
# dependency cache: a poisoned cache entry would reach the published package.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi
      - name: CHANGELOG has this version
        run: |
          grep -qE "^## ${GITHUB_REF_NAME#v}( |$)" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no '## ${GITHUB_REF_NAME#v}' section for the release notes"
            exit 1
          }
      # No install scripts: toolmenu's dependencies need none.
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Pack the package that will be published
        run: |
          npm pack --ignore-scripts
          ls -l toolmenu-*.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: toolmenu-*.tgz
          if-no-files-found: error
          retention-days: 7

  # The tests, in a job of their own: they load every dependency, and none of that
  # can reach the tarball build packed.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test

  publish:
    needs: [build, test]
    runs-on: ubuntu-latest
    # npm's trusted publisher names this environment: no other job, and no workflow on
    # another ref the environment doesn't allow, can publish.
    environment: npm
    # OIDC: npm exchanges it for a one-time publish token and signs the provenance.
    # Nothing in this job runs a dependency.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10. Pinned.
      - name: npm that can publish with OIDC
        run: |
          npm install --global npm@11.21.1 --ignore-scripts --no-audit --no-fund
          npm --version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - name: Publish the tarball the build job built
        run: |
          tarball="toolmenu-${GITHUB_REF_NAME#v}.tgz"
          [ -f "$tarball" ] || { echo "::error::No $tarball from the build job"; ls -l; exit 1; }
          npm publish "./$tarball" --provenance --access public --ignore-scripts

  # Its own job, the only one that can write to the repository, and safe to re-run on
  # its own ("Re-run failed jobs") if it fails after the publish.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: GitHub Release, with this version's CHANGELOG section as its notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists."
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$1 == "##" && $2 == v {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::No notes for $version in CHANGELOG.md"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag

  # The MCP Registry entry (server.json), after npm has the version: the registry
  # checks that the npm package's mcpName names this server. Safe to re-run on its own.
  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: server.json matches package.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          node -e '
            const s = require("./server.json"), p = require("./package.json"), v = process.argv[1];
            const bad = [s.version, s.packages[0].version, p.version].some((x) => x !== v) || s.name !== p.mcpName;
            if (bad) { console.error("::error::server.json and package.json must both say " + v + " and the same name"); process.exit(1); }
          ' "$version"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: mcp-publisher, its signature checked
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl -fsSL -o "$archive" "$base/$archive"
          curl -fsSL -o "$archive.sigstore.json" "$base/$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
      - name: Wait for npm to serve this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do
            [ "$(npm view "toolmenu@$version" mcpName 2>/dev/null)" = "$(node -p "require('./package.json').mcpName")" ] && exit 0
            sleep 10
          done
          echo "::error::npm doesn't serve toolmenu@$version with its mcpName yet"
          exit 1
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
