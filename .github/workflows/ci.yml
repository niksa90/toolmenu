name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only unless a job says otherwise: the tests run dependencies' code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  # toolmenu mcp stops runs differently per platform (process groups on Linux and
  # macOS, taskkill on Windows): its tests on the other two.
  mcp-platforms:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test --test-reporter=spec test/mcp.test.mjs

  # Dogfood: the Action from this checkout, on its own fixture server, then on toolmenu
  # mcp (the PR comment: one per PR, so only the second run posts it).
  action:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The Action fetches the base branch with git; this repository is public, so
        # that needs no stored credentials.
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - uses: ./
        with:
          cli: node dist/cli.js
          command: node test/fixtures/sdk-server.mjs
          baseline: examples/menu.json
          release: 'off'   # package.json is toolmenu's version, not the fixture server's
          comment: 'false'
      - uses: ./
        with:
          cli: node dist/cli.js
          command: node dist/cli.js mcp
          baseline: docs/toolmenu-menu.json
          release: 'off'   # the version is bumped at release, not in each PR

  # The Action on a job whose Node is older than 22: toolmenu gets its own Node 22,
  # and the server and the job's later steps keep Node 20.
  action-old-node:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The Action fetches the base branch with git; this repository is public, so
        # that needs no stored credentials.
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - uses: ./
        with:
          cli: node dist/cli.js
          command: sh -c 'node -v | grep -q "^v20\." && exec node test/fixtures/sdk-server.mjs'
          baseline: examples/menu.json
          release: 'off'
          comment: 'false'
      - name: The job still has Node 20, and toolmenu fetched its own
        run: |
          node -v | grep -q '^v20\.'
          "$RUNNER_TEMP/toolmenu-node/bin/node" -v | grep -q '^v22\.'
