name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  # Dogfood: the Action from this checkout, on its own fixture server.
  action:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - uses: ./
        with:
          cli: node dist/cli.js
          command: node test/fixtures/sdk-server.mjs
          baseline: examples/menu.json
          release: 'off'   # package.json is toolmenu's version, not the fixture server's

  # The Action on a job whose Node is older than 22: toolmenu gets its own Node 22,
  # and the server and the job's later steps keep Node 20.
  action-old-node:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: ./
        with:
          cli: node dist/cli.js
          command: sh -c 'node -v | grep -q "^v20\." && exec node test/fixtures/sdk-server.mjs'
          baseline: examples/menu.json
          release: 'off'
          comment: 'false'
      - name: The job still has Node 20, and toolmenu fetched its own
        run: |
          node -v | grep -q '^v20\.'
          "$RUNNER_TEMP/toolmenu-node/bin/node" -v | grep -q '^v22\.'
