name: pins

# Never runs. It lists the actions `toolmenu init` writes into other projects'
# workflows that this repository's own workflows don't use, so Dependabot keeps their
# pins current here; test/init.test.mjs fails until src/init.ts has the same pins.
on: workflow_dispatch

permissions: {}

jobs:
  pins:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
