<svg xmlns="http://www.w3.org/2000/svg" width="852" height="712" viewBox="0 0 852 712" role="img" aria-label="toolmenu session output (excerpt): a summary of the findings, tools inserted mid-list pinned to the step that caused it, and the next step to fix each">
  <rect width="852" height="712" rx="10" fill="#0d1117"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f57"/><circle cx="42" cy="18" r="6" fill="#febc2e"/><circle cx="62" cy="18" r="6" fill="#28c840"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
  <text x="20" y="44" xml:space="preserve"><tspan fill="#9fb3c8">$ npx toolmenu session --scenario examples/unlock.scenario.yml -- node test/fixtures/session-server.mjs</tspan></text>
  <text x="20" y="62" xml:space="preserve"><tspan fill="#d2a8ff" font-weight="700">toolmenu session</tspan><tspan fill="#c9d1d9" font-weight="700">  examples/unlock.scenario.yml</tspan></text>
  <text x="20" y="80" xml:space="preserve"><tspan fill="#c9d1d9">  session-fixture 1.0.0 · protocol 2026-07-28 · stdio</tspan></text>
  <text x="20" y="98" xml:space="preserve"><tspan fill="#c9d1d9">  baseline: 5 tools · ~290 tokens (estimate) · listening for list_changed: yes</tspan></text>
  <text x="20" y="116" xml:space="preserve"><tspan fill="#c9d1d9">  calls: 5 · 4 answered, 0 tool errors, 0 failed, 1 not sent</tspan></text>
  <text x="20" y="134" xml:space="preserve"><tspan fill="#c9d1d9">  fresh-process check of the starting menu: the same</tspan></text>
  <text x="20" y="152" xml:space="preserve"></text>
  <text x="20" y="170" xml:space="preserve"><tspan fill="#c9d1d9">menu: 5 → 8 tools (+3) · ~290 → ~477 tokens (+187, estimate) · changed at steps 3–5</tspan></text>
  <text x="20" y="188" xml:space="preserve"><tspan fill="#c9d1d9">3 errors, 2 warnings:</tspan></text>
  <text x="20" y="206" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#ff7b72" font-weight="700">ERROR</tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#c9d1d9" font-weight="700">session/mid-insert</tspan><tspan fill="#c9d1d9"> · step 3 · +2 tools inserted at position 1 (list_team_audits,</tspan></text>
  <text x="20" y="224" xml:space="preserve"><tspan fill="#c9d1d9">  get_team_audit).</tspan></text>
  <text x="20" y="242" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#ff7b72" font-weight="700">ERROR</tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#c9d1d9" font-weight="700">session/edit</tspan><tspan fill="#c9d1d9"> · step 5 · get_form: description changed mid-session.</tspan></text>
  <text x="20" y="260" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#ff7b72" font-weight="700">ERROR</tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#c9d1d9" font-weight="700">session/refused</tspan><tspan fill="#c9d1d9"> · step 7 · Refused to call delete_form: it isn't marked readOnlyHint, and</tspan></text>
  <text x="20" y="278" xml:space="preserve"><tspan fill="#c9d1d9">  session calls tools for real.</tspan></text>
  <text x="20" y="296" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#e3b341" font-weight="700">WARN</tspan><tspan fill="#c9d1d9">   </tspan><tspan fill="#c9d1d9" font-weight="700">session/side-effect</tspan><tspan fill="#c9d1d9"> · steps 3–5 · A freshly started server doesn't show this change.</tspan></text>
  <text x="20" y="314" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#e3b341" font-weight="700">WARN</tspan><tspan fill="#c9d1d9">   </tspan><tspan fill="#c9d1d9" font-weight="700">session/append</tspan><tspan fill="#c9d1d9"> · step 4 · +1 tool appended at the end of the list (export_report).</tspan></text>
  <text x="20" y="332" xml:space="preserve"></text>
  <text x="20" y="350" xml:space="preserve"><tspan fill="#8b949e">  ⋮</tspan></text>
  <text x="20" y="368" xml:space="preserve"><tspan fill="#c9d1d9" font-weight="700">step 3:</tspan><tspan fill="#c9d1d9"> call unlock_toolset {"toolset":"audits"} · answered · </tspan><tspan fill="#e3b341">menu changed</tspan><tspan fill="#c9d1d9"> · +2 tools · list_changed</tspan></text>
  <text x="20" y="386" xml:space="preserve"><tspan fill="#c9d1d9">    received · scope: per-process</tspan></text>
  <text x="20" y="404" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#ff7b72" font-weight="700">ERROR</tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#c9d1d9" font-weight="700">session/mid-insert</tspan></text>
  <text x="20" y="422" xml:space="preserve"><tspan fill="#c9d1d9">         +2 tools inserted at position 1 (list_team_audits, get_team_audit). Invalidates the cached</tspan></text>
  <text x="20" y="440" xml:space="preserve"><tspan fill="#c9d1d9">         prompt: the tool list and the conversation after it are processed again.</tspan></text>
  <text x="20" y="458" xml:space="preserve"><tspan fill="#8b949e">           cost: the whole tool list (this server's part: ~406 tokens, estimate) and the conversation</tspan></text>
  <text x="20" y="476" xml:space="preserve"><tspan fill="#c9d1d9">           </tspan><tspan fill="#8b949e">after it; the change starts at position 1</tspan></text>
  <text x="20" y="494" xml:space="preserve"><tspan fill="#c9d1d9">         </tspan><tspan fill="#7ee787" font-weight="700">→ Next:</tspan><tspan fill="#7ee787"> Add new tools at the end of the list, not in the middle; better, list them from the</tspan></text>
  <text x="20" y="512" xml:space="preserve"><tspan fill="#c9d1d9">                 </tspan><tspan fill="#7ee787">start.</tspan></text>
  <text x="20" y="530" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#e3b341" font-weight="700">WARN</tspan><tspan fill="#c9d1d9">   </tspan><tspan fill="#c9d1d9" font-weight="700">session/side-effect</tspan></text>
  <text x="20" y="548" xml:space="preserve"><tspan fill="#c9d1d9">         Steps 3, 4, 5: A freshly started server doesn't show this change. On stdio every connection is</tspan></text>
  <text x="20" y="566" xml:space="preserve"><tspan fill="#c9d1d9">         its own process, so toolmenu can't tell a per-connection change from a global one. On</tspan></text>
  <text x="20" y="584" xml:space="preserve"><tspan fill="#c9d1d9">         2026-07-28 the tool set MUST NOT change as a side effect of requests on the connection.</tspan></text>
  <text x="20" y="602" xml:space="preserve"><tspan fill="#c9d1d9">         </tspan><tspan fill="#7ee787" font-weight="700">→ Next:</tspan><tspan fill="#7ee787"> List the same tools whatever the calls before; to let a conversation reach more tools,</tspan></text>
  <text x="20" y="620" xml:space="preserve"><tspan fill="#c9d1d9">                 </tspan><tspan fill="#7ee787">list them all and let clients load them through tool search.</tspan></text>
  <text x="20" y="638" xml:space="preserve"><tspan fill="#8b949e">  ⋮</tspan></text>
  <text x="20" y="656" xml:space="preserve"><tspan fill="#c9d1d9" font-weight="700">final:</tspan><tspan fill="#c9d1d9"> 8 tools · ~477 tokens (estimate)</tspan></text>
  <text x="20" y="674" xml:space="preserve"><tspan fill="#ff7b72" font-weight="700">✗ 3 errors, 2 warnings, 0 info</tspan></text>
  </g>
</svg>
