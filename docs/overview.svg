<svg xmlns="http://www.w3.org/2000/svg" width="900" height="434" viewBox="0 0 900 434" role="img" aria-label="What a client does with an MCP server, and what toolmenu checks at each step: sign-in (auth check), the connection and the menu (snapshot), tool calls and the menu during a conversation (session), and the next release (diff and review)">
  <rect width="900" height="434" rx="12" fill="#0d1117"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <text x="24" y="38" font-size="15" font-weight="600" fill="#f0f6fc">What a client does with your server<tspan fill="#9da7b3" font-weight="400">, and what toolmenu checks at each step</tspan></text>
  <g transform="translate(24,64)">
    <rect width="272" height="148" rx="10" fill="#161b22" stroke="#30363d"/>
    <circle cx="26" cy="28" r="12" fill="#6E56CF"/>
    <text x="26" y="32.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">1</text>
    <text x="48" y="33" font-size="15" font-weight="600" fill="#f0f6fc">The client signs in</text>
    <text x="18" y="62" font-size="13" fill="#9da7b3">OAuth discovery, walked without</text>
    <text x="18" y="81" font-size="13" fill="#9da7b3">logging in: the 401, resource and</text>
    <text x="18" y="100" font-size="13" fill="#9da7b3">server metadata, PKCE, registration.</text>
    <rect x="18" y="114" width="94" height="22" rx="11" fill="#0d1117" stroke="#5EEAB5" stroke-opacity=".55"/>
    <text x="65" y="129" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5EEAB5">auth check</text>
  </g>
  <path d="M299 138h10m-5 -4l5 4l-5 4" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(314,64)">
    <rect width="272" height="148" rx="10" fill="#161b22" stroke="#30363d"/>
    <circle cx="26" cy="28" r="12" fill="#6E56CF"/>
    <text x="26" y="32.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">2</text>
    <text x="48" y="33" font-size="15" font-weight="600" fill="#f0f6fc">It connects</text>
    <text x="18" y="62" font-size="13" fill="#9da7b3">The handshake on every protocol</text>
    <text x="18" y="81" font-size="13" fill="#9da7b3">version from 2024-11-05 to</text>
    <text x="18" y="100" font-size="13" fill="#9da7b3">2026-07-28, over stdio or HTTP.</text>
    <rect x="18" y="114" width="79.2" height="22" rx="11" fill="#0d1117" stroke="#5EEAB5" stroke-opacity=".55"/>
    <text x="57.6" y="129" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5EEAB5">snapshot</text>
  </g>
  <path d="M589 138h10m-5 -4l5 4l-5 4" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(604,64)">
    <rect width="272" height="148" rx="10" fill="#161b22" stroke="#30363d"/>
    <circle cx="26" cy="28" r="12" fill="#6E56CF"/>
    <text x="26" y="32.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">3</text>
    <text x="48" y="33" font-size="15" font-weight="600" fill="#f0f6fc">It reads the menu</text>
    <text x="18" y="62" font-size="13" fill="#9da7b3">The list against the official schema,</text>
    <text x="18" y="81" font-size="13" fill="#9da7b3">each client’s limits, the token cost,</text>
    <text x="18" y="100" font-size="13" fill="#9da7b3">and the same menu asked for twice.</text>
    <rect x="18" y="114" width="79.2" height="22" rx="11" fill="#0d1117" stroke="#5EEAB5" stroke-opacity=".55"/>
    <text x="57.6" y="129" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5EEAB5">snapshot</text>
  </g>
  <g transform="translate(24,230)">
    <rect width="272" height="148" rx="10" fill="#161b22" stroke="#30363d"/>
    <circle cx="26" cy="28" r="12" fill="#6E56CF"/>
    <text x="26" y="32.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">4</text>
    <text x="48" y="33" font-size="15" font-weight="600" fill="#f0f6fc">The agent calls tools</text>
    <text x="18" y="62" font-size="13" fill="#9da7b3">Read-only tools, or every tool in a</text>
    <text x="18" y="81" font-size="13" fill="#9da7b3">sealed sandbox. Results against</text>
    <text x="18" y="100" font-size="13" fill="#9da7b3">outputSchema; crashes and hangs.</text>
    <rect x="18" y="114" width="71.80000000000001" height="22" rx="11" fill="#0d1117" stroke="#5EEAB5" stroke-opacity=".55"/>
    <text x="53.900000000000006" y="129" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5EEAB5">session</text>
  </g>
  <path d="M299 304h10m-5 -4l5 4l-5 4" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(314,230)">
    <rect width="272" height="148" rx="10" fill="#161b22" stroke="#30363d"/>
    <circle cx="26" cy="28" r="12" fill="#6E56CF"/>
    <text x="26" y="32.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">5</text>
    <text x="48" y="33" font-size="15" font-weight="600" fill="#f0f6fc">The conversation goes on</text>
    <text x="18" y="62" font-size="13" fill="#9da7b3">The menu after every step: a tool</text>
    <text x="18" y="81" font-size="13" fill="#9da7b3">inserted, edited or removed is</text>
    <text x="18" y="100" font-size="13" fill="#9da7b3">pinned to the call that caused it.</text>
    <rect x="18" y="114" width="71.80000000000001" height="22" rx="11" fill="#0d1117" stroke="#5EEAB5" stroke-opacity=".55"/>
    <text x="53.900000000000006" y="129" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5EEAB5">session</text>
  </g>
  <path d="M589 304h10m-5 -4l5 4l-5 4" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(604,230)">
    <rect width="272" height="148" rx="10" fill="#161b22" stroke="#30363d"/>
    <circle cx="26" cy="28" r="12" fill="#6E56CF"/>
    <text x="26" y="32.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">6</text>
    <text x="48" y="33" font-size="15" font-weight="600" fill="#f0f6fc">You ship the next release</text>
    <text x="18" y="62" font-size="13" fill="#9da7b3">Removed tools, new required</text>
    <text x="18" y="81" font-size="13" fill="#9da7b3">parameters, narrowed types, token</text>
    <text x="18" y="100" font-size="13" fill="#9da7b3">growth, and the version bump.</text>
    <rect x="18" y="114" width="116.2" height="22" rx="11" fill="#0d1117" stroke="#5EEAB5" stroke-opacity=".55"/>
    <text x="76.1" y="129" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5EEAB5">diff · review</text>
  </g>
  <path d="M740 214V221H160V227m-4 -5l4 5l4 -5" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/>
  <text x="24" y="412" font-size="13" fill="#9da7b3">No LLM anywhere: the same server gives the same findings on every run. Reports as text, a PR comment, SARIF, JUnit or HTML.</text>
  </g>
</svg>
